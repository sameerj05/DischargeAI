  <script>
    const spec = {
  "openapi": "3.0.3",
  "info": {
    "title": "DischargeAI backend",
    "version": "0.2.0",
    "description": "Discharge summaries in (pasted text, a PDF, or dictated audio), a patient link out, every piece of\ndata self-destructs 30 days after it was created.\n\nSurface: the API note first, the team architecture diagram where the note is silent.\nProvider endpoints need the `x-provider-key` header. Patient endpoints are authenticated by the\nunguessable 256-bit link id (43 base64url characters) and need no header.\n\nThe summary is written by the team's DischargeAI agent on Amazon Bedrock AgentCore Runtime. The\nsum-id is the AgentCore session id, and the agent's response is stored and returned exactly as it\ncame back (canonical: status, flags, summary, plan; the hackathon runtime returned legacy result text). Translation is not built yet:\nGET /translation and GET /translate answer 501.\n"

    }
  ],

    {
      "name": "provider",

    },
    {
      "name": "patient",
      "description": "Patient link (no header; the link id is the credential)."
    }
  ],

        "name": "x-provider-key"

          "type": "string",
          "pattern": "^[A-Za-z0-9_-]{43}$"
        }
      },
      "sumIdUnderscore": {
        "name": "sum_id",
        "in": "query",
        "description": "The same id, as GET /translation spells it",
        "schema": {
          "type": "string",
          "pattern": "^[A-Za-z0-9_-]{43}$"
        }
      },
      "link": {
        "name": "link",
        "in": "query",
        "required": true,
        "description": "The 43-character link id from the patient's email.",
        "schema": {
          "type": "string",
          "pattern": "^[A-Za-z0-9_-]{43}$"
        }
      }
    },
    "schemas": {

        "required": [
          "ID",
          "DOB",
          "FirstName",
          "LastName",
          "ZipCode",
          "email",
          "phoneNumber",
          "caregiverEmail",
          "caregiverName"

        "additionalProperties": false,
        "properties": {

            "oneOf": [

              {
                "type": "integer"
              }

            "type": "string",
            "format": "date",
            "nullable": true,
            "example": "1954-03-18"

            "type": "string",
            "nullable": true
          },
          "LastName": {
            "type": "string",
            "nullable": true
          },
          "ZipCode": {
            "type": "string",
            "nullable": true
          },
          "email": {
            "type": "string",
            "format": "email",
            "nullable": true
          },
          "phoneNumber": {
            "type": "string",
            "nullable": true
          },
          "caregiverEmail": {
            "type": "string",
            "format": "email",
            "nullable": true
          },
          "caregiverName": {
            "type": "string",
            "nullable": true
          }
        }
      },
      "PatientDetail": {
        "description": "GET /patients/{id}: the nine contract keys plus the preferred language and the active link.",
        "allOf": [
          {
            "$ref": "#/components/schemas/Patient"
          },
          {
            "type": "object",
            "properties": {
              "preferredLanguage": {
                "type": "string",
                "nullable": true,
                "description": "BCP-47, when the patients table has such a column; informational"
              },
              "activeLink": {
                "type": "object",
                "nullable": true,
                "properties": {
                  "sumId": {
                    "type": "string"
                  },
                  "link": {
                    "type": "string"
                  },
                  "status": {
                    "type": "string"
                  },
                  "createdAt": {
                    "type": "string",
                    "format": "date-time"
                  },
                  "expiresAt": {
                    "type": "string",
                    "format": "date-time"
                  }
                }
              }
            }
          }
        ]
      },
      "AgentResponse": {
        "description": "The DischargeAI agent's response, stored and returned exactly as it came back, nothing added or\nremoved. On the live runtime (entrypoint agentcore_app.py on the AI-Infra branch) it is\n{ status, flags, summary, plan }: status is approved, needs_clinician_check or needs_human_review,\nflags lists what the agent's own review found, summary is the Going-Home Plan in Markdown, and\nplan holds the same plan as sections. If the agent ever answers with text that is not JSON, that\ntext is stored as a string.\n",
        "type": "object",
        "additionalProperties": true,
        "properties": {
          "status": {
            "type": "string"
          },
          "flags": {
            "type": "array",

            "type": "string"
          },
          "sumId": {
            "type": "string",
            "description": "The same value as sum-id"
          },
          "patientID": {
            "type": "string"
          },
          "status": {
            "type": "string",

          "createdAt": {
            "type": "string",
            "format": "date-time"
          },

      "Accepted": {

          "expiresAt"

            "type": "string"
          },
          "sumId": {
            "type": "string",
            "description": "The random path (43 characters, 256 random bits): the activeLinks.sumId, the DynamoDB uid and sum-id, the sum-id / sum_id query value and the AgentCore session id"
          },
          "link": {
            "type": "string",
            "description": "${PATIENT_APP_URL}/s/${sumId}"
          },
          "jobId": {
            "type": "string"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "statusUrl": {
            "type": "string",
            "description": "/jobs/{jobId}"
          },
          "stage": {
            "type": "string"
          },
          "linkId": {
            "type": "string",
            "description": "The same value as sumId (earlier name)"
          },
          "status": {
            "type": "string",
            "enum": [
              "ingestion started"
            ],
            "description": "The same value as message (earlier name)"
          },
          "appended": {
            "type": "boolean"
          }
        }
      },
      "Job": {
        "type": "object",
        "properties": {
          "jobId": {
            "type": "string"
          },
          "stage": {
            "type": "string",
            "enum": [
              "received",
              "transcribing",
              "simplifying",
              "stored",
              "emailing",
              "done",
              "failed"
            ],
            "description": "simplifying is the agent run"
          },
          "inputKind": {
            "type": "string",
            "enum": [
              "text",
              "pdf",
              "audio"
            ]
          },
          "error": {
            "type": "string",
            "nullable": true
          },
          "meta": {
            "type": "object",
            "additionalProperties": true,
            "description": "provider (agentcore), agentRuntimeArn, agentMs, sourceChars, pdfPages, pdfEngine, pdfStore, speechProvider"
          },
          "sumId": {
            "type": "string"
          },
          "linkRef": {
            "type": "string",
            "description": "First 8 hex characters of the sumId's sha256",
            "for logs": null
          },
          "linkStatus": {
            "type": "string",
            "nullable": true,
            "enum": [
              "pending",
              "ready",
              "failed",
              "expired",
              "purged"
            ]
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "SynthesizeRequest": {
        "type": "object",
        "description": "Exactly one of sumId (or linkId) or text.",
        "properties": {
          "sumId": {
            "type": "string",
            "description": "Send the raw text stored for this summary to the agent again (session id = this sum-id) and store the new response"
          },
          "linkId": {
            "type": "string",
            "description": "The same as sumId (earlier name)"
          },
          "text": {
            "type": "string",
            "description": "Send this text to the agent in a fresh session and return the response without storing it"
          }
        }
      },
      "SynthesizeResponse": {
        "type": "object",
        "properties": {

            "type": "boolean"

            "type": "string"
          },

            "type": "string",

              "ready"

          "llm-summary": {
            "$ref": "#/components/schemas/AgentResponse"
          },
          "latencyMs": {
            "type": "integer"
          },
          "linkRef": {
            "type": "string"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Health": {
        "type": "object",
        "properties": {
          "ok": {
            "type": "boolean"
          },
          "service": {
            "type": "string"
          },
          "mode": {
            "type": "string",
            "enum": [
              "aws",
              "local-test",
              "local-agentcore"
            ]
          },
          "capabilities": {
            "type": "object",
            "properties": {
              "liveAi": {
                "type": "boolean"
              },

          "config": {

            "properties": {

                "DEFAULT unless AGENT_QUALIFIER is set": null

  },
  "paths": {
    "/auth/login": {
      "post": {

        ],
        "summary": "Local demo provider sign-in (501 outside local modes)",

          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "email",
                  "password"
                ],
                "properties": {
                  "email": {
                    "type": "string"
                  },
                  "password": {
                    "type": "string"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Local doctor session and local provider key"
          },
          "400": {
            "description": "Invalid body"
          },
          "401": {
            "description": "Invalid credentials"
          },
          "501": {
            "description": "Production provider sign-in is not configured"
          }
        }
      }
    },
    "/auth/link": {
      "post": {
        "tags": [
          "patient"
        ],
        "summary": "Check patient DOB and a ready bearer link for the original role form",
        "description": "The role selects a presentation; both roles use the same bearer-link permission. Existing GET summary APIs still accept the link directly.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "token",
                  "dob",
                  "role"

                "properties": {
                  "token": {
                    "type": "string"

                    "type": "string",

          }
        },
        "responses": {
          "200": {
            "description": "Patient or caregiver session marker"
          },
          "400": {
            "description": "Invalid body"
          },
          "401": {
            "description": "Invalid token or DOB"
          },
          "409": {
            "description": "Local demo alias has no submitted plan yet"
          },
          "410": {
            "description": "Link expired"
          },

            "providerKey": []

            "description": "Patients",

          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "ID",
                  "DOB"
                ],

                    "type": "string",
                    "maxLength": 64
                  },
                  "DOB": {
                    "type": "string",
                    "format": "date"
                  },
                  "FirstName": {
                    "type": "string"
                  },
                  "LastName": {
                    "type": "string"
                  },

                    "format": "email"

                    "type": "string",
                    "format": "email"
                  },

    "/ingest": {
      "post": {
        "tags": [
          "provider"
        ],
        "security": [
          {
            "providerKey": []
          }
        ],
        "summary": "Task 3 of the backend tasks doc: ingest a discharge summary for a patient; 202 before the agent runs",
        "description": "JSON body { data, type, patientID } (the tasks doc). type \"text\": data is the discharge summary text.\ntype \"pdf\": data is the PDF as base64 (a data:application/pdf;base64, prefix is accepted); the PDF is\nconverted with pdfToText and stored in S3 emrpdf-rh as \u003csumId>.pdf. Any other type answers\n400 { statusCode: 400, message: \"type must be text or pdf\" }.\nThe random path (sumId) is stored in the SQL activeLinks table and is the DynamoDB uid of the summary\nitem. Before the response, a PDF is converted with pdfToText (a PDF with no readable text answers 400\nunreadable_pdf and nothing is saved) and the text, pasted or extracted, is saved on the item as raw-text.\nThe response comes at once; then, asynchronously: the text goes to the DischargeAI agent on AgentCore\n(session id = the sumId) and the call is awaited (it can take minutes), the agent's whole response is\nsaved as llm-summary with sum-id on the same item (expiresAt = now + 30 days), and the link is emailed\nto the patient's email and to caregiverEmail whatever status the agent gave. Nothing is translated.\nThe earlier multipart form (patientId + one of text, file, audio) is kept as an alias; audio comes from\nthe architecture diagram and goes to S3 emraudio-rh.\nThe opt-in local-agentcore mode uses local stores and captured email instead of AWS storage/email.\nAudio returns 501 when no live speech provider is configured.\n\nSend DOB with patientID to validate the identity and append to the active 30-day plan. The link and original expiry remain unchanged; appended notes regenerate the plan and clear translated caches. Omit DOB for the legacy independent-plan API. Expired plans start a new period.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "data",
                  "type",
                  "patientID"
                ],
                "properties": {
                  "data": {
                    "type": "string",
                    "description": "The text (type text) or the PDF as base64 (type pdf)"
                  },
                  "type": {
                    "type": "string",
                    "enum": [
                      "text",
                      "pdf"
                    ]
                  },
                  "patientID": {
                    "oneOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "integer"
                      }
                    ],
                    "description": "The patient's ID from GET /patients (text or number)"
                  },
                  "DOB": {
                    "type": "string",
                    "format": "date",
                    "description": "Validated patient DOB; selects append behavior for the active 30-day plan"
                  }
                }
              },
              "examples": {
                "text": {
                  "value": {
                    "type": "text",
                    "patientID": "1",
                    "data": "New medications:\n- Furosemide 40 mg by mouth once daily for swelling"
                  }
                }
              }
            },
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "required": [
                  "patientId"
                ],
                "properties": {
                  "patientId": {
                    "type": "string"
                  },
                  "text": {
                    "type": "string",
                    "description": "Pasted EMR text"
                  },
                  "file": {
                    "type": "string",
                    "format": "binary",
                    "description": "PDF"
                  },
                  "audio": {
                    "type": "string",
                    "format": "binary",
                    "description": "Dictation (wav, mp3, m4a, webm, ogg, flac); stored in the audio bucket as \u003csumId>.\u003cext>"
                  },
                  "DOB": {
                    "type": "string",
                    "format": "date",
                    "description": "Validated patient DOB; selects append behavior for the active 30-day plan"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "ingestion started",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Accepted"
                }
              }
            }
          },
          "400": {
            "description": "type must be text or pdf, missing patientID or data, empty_input, multiple_inputs, unreadable_pdf, input_too_long, or validation error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Missing or wrong x-provider-key"
          },
          "404": {
            "description": "patient_not_found"
          },
          "409": {
            "description": "Patient DOB mismatch or patient currently processing"
          },
          "413": {
            "description": "file_too_large"
          },
          "501": {
            "description": "live_dictation_unavailable in local-agentcore mode",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/jobs/{jobId}": {
      "get": {
        "tags": [
          "provider"
        ],
        "security": [
          {
            "providerKey": []
          }
        ],
        "summary": "Follow the 202 (stage and run metadata; no patient text)",
        "parameters": [
          {
            "name": "jobId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Job",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Job"
                }
              }
            }
          },
          "404": {
            "description": "job_not_found"
          }
        }
      }
    },
    "/synthesize": {
      "post": {
        "tags": [
          "provider"
        ],
        "security": [
          {
            "providerKey": []
          }
        ],
        "summary": "Run the DischargeAI agent again, or on any text",
        "description": "`{ text }` sends the text to the agent in a fresh session and returns its response without storing anything.\n`{ sumId }` (or `linkId`) sends the raw text stored for the summary to the agent again, with the sum-id as the\nsession id, replaces llm-summary with the new response, and emails the patient if the link had not been sent.\n",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SynthesizeRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "The agent's response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SynthesizeResponse"
                }
              }
            }
          },
          "400": {
            "description": "empty_input or invalid_link"
          },
          "404": {
            "description": "link_not_found"
          },
          "409": {
            "description": "job_in_progress (the ingest job has not finished) or no_source_text"
          },
          "410": {
            "description": "link_expired or link_purged"
          },
          "500": {
            "description": "The agent failed or timed out"
          }
        }
      }
    },
    "/llm-sumary": {
      "get": {
        "tags": [
          "patient"
        ],
        "summary": "Task 4 of the backend tasks doc (spelled so): the agent's response saved on the DynamoDB item for a summary id",
        "parameters": [
          {
            "$ref": "#/components/parameters/sumIdHyphen"
          },
          {
            "$ref": "#/components/parameters/sumIdUnderscore"
          }
        ],
        "responses": {
          "200": {
            "description": "The item's llm-summary",
            "as the agent returned it": null,
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LlmSummaryView"
                }
              }
            }
          },
          "400": {
            "description": "missing_sum_id or invalid_link",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "link_not_found"
          },
          "410": {
            "description": "link_expired (checked at read time",
            "before any purge) or link_purged": null
          },
          "425": {
            "description": "processing (the agent is still working); body carries { stage, jobId }"
          },
          "500": {
            "description": "processing_failed (the agent run failed)"
          }
        }
      }
    },

        ],
